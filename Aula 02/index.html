<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PETSHOP SENAI 🐶</title>
</head>

<body>
    <div id="cabecalho">
        <img src="./Imagens/perfil.png" alt="Não foi possível carregar a imagem">
        <h1>Encontre tudo para o seu pet</h1>
        <p>PetShop</p>
    </div>

    <div class="pesquisa">
        <input type="text" placeholder="Pesquisar">
    </div>

    <div class="card-grupo">
        <div style="background-image: url(./Imagens/gato.jpg);" class="card-pet">
            <p>Gatos</p>
        </div>

        <div style="background-image: url(./Imagens/cachorro.jpg);" class="card-pet">
            <p>Cachorro</p>
        </div>

        <div style="background-image: url(./Imagens/aves.png);" class="card-pet">
            <p>Aves</p>
        </div>

        <div style="background-image: url(./Imagens/peixe.png);" class="card-pet">
            <p>Peixe</p>
        </div>
    </div>

    <div class="grupo-membros">
        <div class="card-membros">
            <div class="card-esquerdo"></div>
            <p>
                Torne-se um membro e Ganhe um desconto
            </p>
            <div class="card-direito"></div>
        </div>
    </div>

</body>

</html>
