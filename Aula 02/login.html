<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN PETSHOP 🐶</title>
</head>

<body>
    <div class="grupo-login">
        <div class="lado-esquerdo">
            <p class="texto"> Bem-vindo</p>
        </div>
        <div class="lado-direito">
            <p> Encontre tudo o que você precisa para seu animal de estimação </p>
            <div class="pesquisa-google">
                <input type="text" placeholder="Entrar com Google">
            </div>
            <div class="pesquisa-apple">
                <input type="text" placeholder="Entrar com Apple">
            </div>
            <div class="pesquisa-email">
                <input type="text" placeholder="Entrar com E-mail">
            </div>
            <p> Você quer tentar de outra maneira? </p>
            <div class="botao-login">
                <p> Vamos lá </p>
            </div>
        </div>
    </div>
</body>

</html>
